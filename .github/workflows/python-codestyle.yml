name: Reusable - Python codestyle check (ruff)

on:
  workflow_call:
    inputs:
      ruff_version:
        description: |
          Ruff version to run, e.g. 0.15.22. Pin this to the same rev the caller
          uses in .pre-commit-config.yaml so CI and local hooks agree.
        required: false
        type: string
        default: 'latest'

jobs:
  style-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run ruff formatting check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: ${{ inputs.ruff_version }}
          args: format --check

      - name: Run ruff linting check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: ${{ inputs.ruff_version }}
          args: check
